<!-- Chess4Me app icon: a simple sketch-style knight, drawn for Chess4Me.
     Placeholder for now. The PNG files next to it are copies of this drawing. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Green background (the iPhone rounds the corners itself) -->
  <rect width="512" height="512" fill="#2e5e3e"/>

  <!-- Base of the piece -->
  <rect x="140" y="392" width="250" height="48" rx="14" fill="#f4f1ea" stroke="#1c3a26" stroke-width="10"/>

  <!-- The knight's head and body -->
  <path d="M175 395 C175 335 200 295 238 262 L160 292 C138 300 118 282 126 258 C132 240 145 228 162 214
           L214 150 L232 88 L262 132 C330 150 372 220 372 300 C372 340 366 370 364 395 Z"
        fill="#f4f1ea" stroke="#1c3a26" stroke-width="10" stroke-linejoin="round"/>

  <!-- A second, slightly shifted outline makes it look hand-sketched -->
  <path d="M181 391 C181 333 205 293 243 258 L163 287 C143 294 125 279 132 257 C138 241 150 230 166 217
           L218 155 L235 96 L265 137 C331 157 368 224 367 302 C367 338 363 366 361 390"
        fill="none" stroke="#1c3a26" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>

  <!-- Sketch lines: mane, shading on the back, and the line on the base -->
  <g fill="none" stroke="#1c3a26" stroke-width="5" stroke-linecap="round">
    <path d="M268 150 C285 165 296 180 302 196"/>
    <path d="M292 168 C310 185 322 202 330 222"/>
    <path d="M315 192 C333 212 344 232 350 255"/>
    <path d="M340 300 L320 330"/>
    <path d="M350 325 L326 360"/>
    <path d="M352 352 L334 380"/>
    <path d="M160 416 L370 416" stroke-width="3" opacity="0.5"/>
  </g>

  <!-- Eye and nostril -->
  <circle cx="205" cy="192" r="10" fill="#1c3a26"/>
  <circle cx="146" cy="258" r="5" fill="#1c3a26"/>
</svg>
