<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Makes the page fit phone screens properly -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The title is filled in by app.js from config.js, so the name lives in one place -->
  <title></title>

  <!-- App settings for "Add to Home Screen": name, colours and icons (see manifest.json) -->
  <link rel="manifest" href="manifest.json">
  <!-- Icon shown in the browser tab, and on the iPhone home screen -->
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <!-- Open full screen (no browser bars) when started from the home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Status bar (clock, battery) style on iPhone, and the app's colour for the browser -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#2e5e3e">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- The app has several "screens". Only one is shown at a time (app.js switches
       between them by adding/removing the "hidden" attribute). -->

  <!-- ===== Main menu ===== -->
  <section id="menu-screen" class="screen screen-narrow">
    <!-- App name heading (text filled in by app.js) -->
    <h1 id="app-title"></h1>

    <!-- The course cards: app.js fills this in from the saved courses -->
    <div id="course-list" class="course-list"></div>

    <!-- Sound buttons ("sound-toggle") get their icon from sounds.js -->
    <div class="button-row">
      <button id="menu-new" class="button">New course</button>
      <button id="menu-export" class="button">Export</button>
      <button id="menu-import" class="button">Import</button>
      <button id="menu-sound" class="button sound-toggle" aria-label="Sound"></button>
    </div>

    <!-- Hidden file chooser, opened by the Import button (see backup.js) -->
    <input id="import-file" type="file" accept="application/json,.json" hidden>
  </section>

  <!-- ===== Course explorer (browsing a course; opened by tapping a course card) ===== -->
  <section id="explorer-screen" class="screen" hidden>
    <!-- Back on the left, course name and colour in the middle, sound on/off on the right -->
    <div class="top-bar">
      <button id="explorer-back" class="back-button">&larr; Back</button>
      <h2 id="explorer-title" class="explorer-title"></h2>
      <button id="explorer-sound" class="back-button sound-toggle" aria-label="Sound"></button>
    </div>

    <!-- Same layout as practice mode -->
    <div class="practice-layout">
      <div id="explorer-board-area" class="board-area">
        <!-- The board is moved here by explorer.js -->

        <!-- The comment for the current move, if it has one (filled in by explorer.js) -->
        <div id="explorer-comment" class="comment-box" hidden></div>
      </div>

      <div class="side-panel">
        <!-- Start, Back one move, Forward one move (forward follows the main line) -->
        <div class="button-row button-row-tight">
          <button id="explorer-start" class="button arrow-button" aria-label="Start position" title="Start position">&laquo;</button>
          <button id="explorer-prev" class="button arrow-button" aria-label="Back one move" title="Back one move">&lsaquo;</button>
          <button id="explorer-next" class="button arrow-button" aria-label="Forward one move" title="Forward one move">&rsaquo;</button>
        </div>

        <!-- Stats for the current position (filled in by explorer.js) -->
        <div id="explorer-stats" class="stats-box"></div>

        <!-- The whole move tree: tap a move to jump there (filled in by explorer.js) -->
        <div id="explorer-move-list" class="move-list"></div>

        <!-- Main actions (big). "This line" = the moves from the start to the current move. -->
        <div class="button-row">
          <button id="explorer-from-here" class="button">Practice lines through here</button>
          <button id="explorer-line-only" class="button">Practice this line only</button>
          <button id="explorer-watch" class="button">Watch this line</button>
          <button id="explorer-practice" class="button">Practice all</button>
          <button id="explorer-cover" class="button">Cover every line</button>
        </div>

        <!-- Less-used actions (smaller) -->
        <div class="button-row button-row-tight explorer-small-actions">
          <button id="explorer-edit" class="button button-secondary button-small">Edit</button>
          <button id="explorer-delete" class="button button-secondary button-small">Delete</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== Practice mode ===== -->
  <section id="practice-screen" class="screen" hidden>
    <!-- Back on the left, sound on/off on the right -->
    <div class="top-bar">
      <button id="practice-back" class="back-button">&larr; Back</button>
      <button id="practice-sound" class="back-button sound-toggle" aria-label="Sound"></button>
    </div>
    <h2 id="practice-title"></h2>
    <!-- "Line 3 of 7" while covering every line (filled in by practice.js) -->
    <p id="practice-progress" class="help-text practice-progress" hidden></p>

    <!-- Board on the left and the side panel on the right on wide screens;
         the side panel goes below the board on narrow screens (phones). -->
    <div class="practice-layout">
      <div id="practice-board-area" class="board-area">
        <!-- The chessboard: board.js fills this with 64 squares.
             There is only one board: watch mode moves it onto its own screen. -->
        <div id="board" class="board"></div>

        <!-- The comment for the last move, if it has one (filled in by practice.js) -->
        <div id="practice-comment" class="comment-box" hidden></div>
      </div>

      <div class="side-panel">
        <!-- Short messages, e.g. "Your move." (filled in by practice.js) -->
        <p id="practice-status" class="status"></p>

        <!-- Help buttons: only usable on the user's turn; hidden at the end of the line -->
        <div id="practice-controls" class="button-row button-row-tight">
          <button id="practice-hint" class="button">Hint</button>
          <button id="practice-show" class="button">Show move</button>
        </div>

        <!-- The moves played so far (filled in by practice.js) -->
        <div id="practice-move-list" class="move-list"></div>

        <!-- Shown at the end of the line -->
        <div id="practice-end" class="button-row" hidden>
          <!-- "Next line" is only used when covering every line -->
          <button id="practice-next" class="button" hidden>Next line</button>
          <button id="practice-restart" class="button">Restart</button>
          <button id="practice-menu" class="button">Main menu</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== Watch mode ===== -->
  <section id="watch-screen" class="screen" hidden>
    <!-- Back on the left, sound on/off on the right -->
    <div class="top-bar">
      <button id="watch-exit" class="back-button">&larr; Back</button>
      <button id="watch-sound" class="back-button sound-toggle" aria-label="Sound"></button>
    </div>
    <h2 id="watch-title"></h2>

    <!-- Same layout as practice mode -->
    <div class="practice-layout">
      <div id="watch-board-area" class="board-area">
        <!-- The board is moved here by watch.js -->

        <!-- The comment for the last move, if it has one (filled in by watch.js) -->
        <div id="watch-comment" class="comment-box" hidden></div>
      </div>

      <div class="side-panel">
        <!-- e.g. "Start position" or "End of the line" (filled in by watch.js) -->
        <p id="watch-status" class="status"></p>

        <!-- Back one move, Play/Pause, Forward one move, Restart -->
        <div class="button-row button-row-tight">
          <button id="watch-back" class="button arrow-button" aria-label="Back one move" title="Back one move">&lsaquo;</button>
          <button id="watch-play" class="button">Play</button>
          <button id="watch-forward" class="button arrow-button" aria-label="Forward one move" title="Forward one move">&rsaquo;</button>
          <button id="watch-restart" class="button">Restart</button>
        </div>

        <!-- The moves played so far (filled in by watch.js) -->
        <div id="watch-move-list" class="move-list"></div>
      </div>
    </div>
  </section>

  <!-- ===== Course editor (new course, or editing one) ===== -->
  <section id="editor-screen" class="screen" hidden>
    <!-- "New course" or "Edit course" (filled in by editor.js) -->
    <h2 id="editor-title"></h2>

    <!-- Course name and colour -->
    <div class="field">
      <label for="editor-name" class="field-label">Course name</label>
      <input id="editor-name" class="text-input" type="text" maxlength="60" autocomplete="off">
    </div>

    <div class="field">
      <span class="field-label">You play</span>
      <div class="colour-choice">
        <label class="colour-option">
          <input type="radio" name="editor-colour" value="white">
          <span class="colour-box colour-box-white"></span> White
        </label>
        <label class="colour-option">
          <input type="radio" name="editor-colour" value="black">
          <span class="colour-box colour-box-black"></span> Black
        </label>
      </div>
    </div>

    <!-- Same layout as practice mode -->
    <div class="practice-layout">
      <div id="editor-board-area" class="board-area">
        <!-- The board is moved here by editor.js -->
      </div>

      <div class="side-panel">
        <!-- "White to move" / "Black to move" (filled in by editor.js) -->
        <p id="editor-status" class="status"></p>

        <!-- Back / forward one move (forward follows the main line), and Undo -->
        <div class="button-row button-row-tight">
          <button id="editor-back" class="button arrow-button" aria-label="Back one move" title="Back one move">&lsaquo;</button>
          <button id="editor-forward" class="button arrow-button" aria-label="Forward one move" title="Forward one move">&rsaquo;</button>
          <button id="editor-undo" class="button button-secondary">Undo last move</button>
        </div>

        <!-- Managing side lines (for the current move) -->
        <div class="button-row button-row-tight">
          <button id="editor-main-line" class="button button-secondary">Make main line</button>
          <button id="editor-delete-from" class="button button-secondary">Delete from here</button>
        </div>

        <!-- The whole move tree: tap a move to jump to it and comment on it (filled in by editor.js) -->
        <div id="editor-move-list" class="move-list"></div>
        <p id="editor-help" class="help-text">Tap a move to jump to it and add a comment. Play a different opponent move from there to add a side line.</p>

        <!-- Comment box for the tapped move (shown when a move is tapped) -->
        <div id="editor-comment-panel" class="comment-panel" hidden>
          <!-- Line name: only shown for the first move of a side line -->
          <div id="editor-line-name-field" class="field" hidden>
            <label for="editor-line-name" class="field-label">Line name (optional)</label>
            <input id="editor-line-name" class="text-input" type="text" maxlength="60" autocomplete="off"
              placeholder="e.g. Two Knights Defence">
          </div>
          <label for="editor-comment" id="editor-comment-label" class="field-label"></label>
          <textarea id="editor-comment" class="text-input" rows="3" maxlength="500"></textarea>
          <div class="button-row button-row-tight">
            <button id="editor-comment-delete" class="button button-secondary">Delete comment</button>
            <button id="editor-comment-done" class="button">Done</button>
          </div>
        </div>

        <div class="button-row">
          <button id="editor-save" class="button">Save</button>
          <button id="editor-cancel" class="button button-secondary">Cancel</button>
        </div>
        <!-- e.g. "Please enter a course name." (filled in by editor.js) -->
        <p id="editor-message" class="error-text"></p>
      </div>
    </div>
  </section>

  <!-- ===== Pop-up for questions and messages (used by askChoice in app.js) ===== -->
  <dialog id="confirm-dialog" class="dialog">
    <p id="confirm-message"></p>
    <!-- The buttons are added by askChoice -->
    <div id="confirm-buttons" class="button-row"></div>
  </dialog>

  <!-- Classic script tags (not modules) so the page works by double-clicking index.html.
       Order matters: the chess.js library, config, storage and sounds first, then the board,
       practice, watch, editor and backup code, then the app that uses them. -->
  <script src="lib/chess.js"></script>
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/sound-data.js"></script>
  <script src="js/sounds.js"></script>
  <script src="js/board.js"></script>
  <script src="js/practice.js"></script>
  <script src="js/watch.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/explorer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
